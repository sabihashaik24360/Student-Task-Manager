<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div>
            <h1>Student Task Manager</h1>
            <p>Plan your studies. Track your progress.</p>
        </div>
        <span class="logo">ST</span>
    </header>

    <main>
        <section class="stats">
            <div class="stat-card">
                <span>Total Tasks</span>
                <h2 id="totalCount">0</h2>
            </div>
            <div class="stat-card">
                <span>Pending</span>
                <h2 id="pendingCount">0</h2>
            </div>
            <div class="stat-card">
                <span>Completed</span>
                <h2 id="completedCount">0</h2>
            </div>
        </section>

        <section class="panel">
            <h2>Add a New Task</h2>
            <form id="taskForm">
                <label for="title">Task title</label>
                <input id="title" type="text"
                       placeholder="e.g. Complete Java assignment" required>

                <label for="description">Description</label>
                <textarea id="description" rows="3"
                          placeholder="Enter task details" required></textarea>

                <button type="submit">+ Add Task</button>
            </form>
        </section>

        <section class="task-section">
            <div class="task-heading">
                <h2>My Tasks</h2>
                <input id="search" type="search"
                       placeholder="Search tasks...">
            </div>

            <div class="filters">
                <button class="filter active" data-filter="all">All</button>
                <button class="filter" data-filter="pending">Pending</button>
                <button class="filter" data-filter="completed">Completed</button>
            </div>

            <div id="taskList"></div>
        </section>
    </main>

    <footer>Student Task Manager · Stay organized, keep learning.</footer>
    <script src="script.js"></script>
</body>
</html>
